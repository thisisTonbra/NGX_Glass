<title>Arc Nigeria Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control room. Left rail groups the 25 views by job (Command, Build, Adopt, Reach, Talent, Operate, Data);
   sticky filter bar on top; each view reads summary tiles -> charts -> live team records. */
:root{
  --bg:#f5f6f2; --panel:#ffffff; --panel-2:#eef0eb; --fg:#111512; --fg-2:#49524b; --muted:#737d75;
  --line:#dfe3dc; --line-2:#c6cdc5; --accent:#0c6a46; --accent-ink:#ffffff; --accent-soft:#dcefe4;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --bad:#d03b3b; --good-ink:#006300; --bad-ink:#b02a2a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 12px 40px rgba(17,21,18,.18);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d100e; --panel:#151917; --panel-2:#1c211e; --fg:#edf0eb; --fg-2:#b6bfb8; --muted:#858f87;
  --line:#252b27; --line-2:#353d38; --accent:#3dbd88; --accent-ink:#07130d; --accent-soft:#163024;
  --good-ink:#2fc02f; --bad-ink:#f07a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d100e; --panel:#151917; --panel-2:#1c211e; --fg:#edf0eb; --fg-2:#b6bfb8; --muted:#858f87;
  --line:#252b27; --line-2:#353d38; --accent:#3dbd88; --accent-ink:#07130d; --accent-soft:#163024;
  --good-ink:#2fc02f; --bad-ink:#f07a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:14px/1.5 var(--font-body);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding-block:18px 32px;padding-inline:14px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand b{font:700 19px/1.1 var(--font-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.flag{display:inline-flex;gap:0;width:22px;height:12px;border-radius:2px;overflow:hidden;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
.flag i{flex:1;background:var(--good-ink)} .flag i:nth-child(2){background:var(--panel)}
.navgroup{margin-top:12px}
.navgroup h4{margin:0 0 4px;padding:0 8px;font:600 10.5px/1.4 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:var(--r);cursor:pointer;color:var(--fg-2)}
.navbtn:hover{background:var(--panel-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.navbtn .dot{width:8px;height:8px;border-radius:50%;flex:none}
.main{min-width:0;padding-inline:28px;padding-block:0 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.topbar .grow{flex:1 1 auto}
.navselect{display:none}
.field-inline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select.ctl,input.ctl{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg-2);white-space:nowrap}
.chip .led{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.live .led{background:var(--good)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);padding:6px 12px;border-radius:var(--r);cursor:pointer;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--fg-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad-ink);border-color:var(--bad)}
.btn.small{padding:3px 9px;min-height:28px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.banner{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px dashed var(--warn);border-radius:var(--r);background:color-mix(in srgb,var(--warn) 10%,var(--panel));font-size:13px}
.banner.info{border-color:var(--line-2);background:var(--panel)}
.viewhead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;margin:26px 0 18px}
.viewhead h1{margin:0;font:700 clamp(24px,3vw,32px)/1.1 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.viewhead p{margin:6px 0 0;color:var(--fg-2);max-width:68ch}
.eyebrow{font:600 11px/1.4 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.section{margin-top:22px}
.section > h2,.card > h3{margin:0 0 10px;font:600 15px/1.3 var(--font-body)}
.section > h2 small,.card > h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:12px;color:var(--fg-2)}
.tile .val{font:500 26px/1.15 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tile svg.spark{width:100%;height:28px;margin-top:2px}
.up{color:var(--good-ink)} .down{color:var(--bad-ink)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px 1px 6px;border-radius:999px;background:var(--panel-2);color:var(--fg-2);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.good::before{background:var(--good)} .status.warn::before{background:var(--warn)} .status.serious::before{background:var(--serious)} .status.bad::before{background:var(--bad)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:14px}
.hero .big{font:500 clamp(40px,6vw,64px)/1 var(--font-mono);letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.pillars{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard:hover{border-color:var(--fg-2)}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .score{font:500 22px/1 var(--font-mono)}
.pcard .meter{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.pcard .meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pcard .kpi{font-size:12px;color:var(--muted)}
/* charts */
.chart{position:relative;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{fill:var(--muted);font:11px var(--font-mono)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:var(--r);padding:8px 10px;font-size:12px;min-width:120px;z-index:3;white-space:nowrap}
.tip b{display:block;margin-bottom:4px;font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fg-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.bar .l{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:14px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar .v{font:12px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.bar.drop .l{color:var(--fg);font-weight:600}
.funnel .bar{grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto auto}
.funnel .c{font:11.5px var(--font-mono);color:var(--muted);min-width:56px;text-align:right}
.funnel .bar.drop .c{color:var(--bad-ink);font-weight:500}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:13px;text-align:center}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbltools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tbltools .grow{flex:1 1 160px}
.tbltools input{width:100%;max-width:280px}
table.rec{width:100%;border-collapse:collapse;font-size:13px}
table.rec th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;font-size:12px;color:var(--fg-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.rec th.num,table.rec td.num{text-align:right}
table.rec td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rec td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.rec tbody tr{cursor:pointer}
table.rec tbody tr:hover td{background:var(--panel-2)}
table.rec tr:last-child td{border-bottom:0}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.list{display:flex;flex-direction:column}
.list .item{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.list .item:last-child{border-bottom:0}
.list .when{font:12px var(--font-mono);color:var(--muted);min-width:78px}
.list .item .grow{flex:1;min-width:0}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:12px}
.matrix .cell{aspect-ratio:2/1;max-width:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font:500 16px var(--font-mono)}
.matrix .ax{color:var(--muted);display:flex;align-items:center;justify-content:center;padding:2px 6px}
.phase{display:grid;grid-template-columns:30fr 60fr 90fr;gap:4px;margin-top:10px}
.phase div{padding:8px 10px;border-radius:4px;background:var(--panel-2);font-size:12px;position:relative}
.phase div.on{background:var(--accent-soft);outline:1px solid var(--accent)}
.phase b{display:block;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
pre.report{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;font:12.5px/1.6 var(--font-mono);max-height:560px;overflow:auto}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stage{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel);font-size:12px;color:var(--fg-2)}
.stage b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.stage .n{font:11px var(--font-mono);color:var(--accent)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);width:min(720px,100%);padding:20px}
.modal h2{margin:0 0 4px;font:700 20px/1.2 var(--font-display)}
.modal .hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2);min-width:0}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;min-height:36px;width:100%}
.form textarea{min-height:72px;resize:vertical}
.form fieldset{grid-column:1/-1;border:0;border-top:1px solid var(--line);padding:12px 0 0;margin:4px 0 0;display:grid;grid-template-columns:inherit;gap:12px}
.form legend{font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:8px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px}
.modal .actions .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--font-mono)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .navselect{display:block;flex:1 1 100%}
  .navselect select{width:100%}
  .main{padding-inline:16px}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Dashboard sections">
    <div class="brand"><b><span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>Arc Nigeria</b><span>Ecosystem growth · team dashboard</span></div>
    <div id="navlist"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="navselect"><label class="field-inline" for="nav-select">View <select class="ctl" id="nav-select"></select></label></div>
      <label class="field-inline" for="f-city">City <select class="ctl" id="f-city"></select></label>
      <label class="field-inline" for="f-period">Period <select class="ctl" id="f-period">
        <option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="180">Last 180 days</option><option value="365">Last 12 months</option><option value="all">All time</option>
      </select></label>
      <span class="grow"></span>
      <span class="chip" id="conn"><span class="led"></span><span id="conn-t">Connecting…</span></span>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
(() => {
'use strict';

/* ---------- option lists ---------- */
const PARTNER_TYPES=['Fintech / PSP','Exchange / Ramp','Wallet','Remittance','Bank / MFB','Merchant / Marketplace','Telco','Hub / Accelerator','University','Media','VC / Investor','Government / Agency','Infra (RPC, oracle, indexer, audit)'];
const CIRCLE_PRODUCTS=['Arc Studio','App Kit: Payments','App Kit: Onramp','App Kit: Bridging','App Kit: Swaps','USDC','CCTP','Gateway','Wallets','Arc Portal','Docs','Other'];

const PILLAR_NAMES=['Builders & Studio','Education','Projects & Grants','Onchain & Apps','Users & Ramps','BD & Partners','Content & Social','Brand & Intel','Community','Events','Jobs & Bounties','Policy & Trust','Product feedback','Growth ops'];

/* ---------- monthly numbers (national, entered or imported monthly) ---------- */
const METRICS=[

  {k:'followers_x',l:'X followers',g:'Audience'},

  {k:'sentiment_pos_pct',l:'Positive sentiment share',g:'Brand',f:'pct'},
  {k:'share_of_voice_pct',l:'Share of voice vs other chains',g:'Brand',f:'pct'},
  {k:'members_total',l:'Community members',g:'Community'},
  {k:'members_active',l:'Weekly active members',g:'Community'},
  {k:'contributors',l:'Contributors',g:'Community'},
  {k:'chapters',l:'City + campus chapters',g:'Community'},
  {k:'nps',l:'Community NPS',g:'Community'},
];
const MDEF=Object.fromEntries(METRICS.map(m=>[m.k,m]));
const STUDIO=[
  ['studio_aware','Aware','Heard of Arc or Studio; visits from Nigeria'],
  ['studio_signups','Signed up','Created an Arc Studio account'],

const $=(q,el=document)=>el.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const has=v=>v!==undefined&&v!==null&&v!=='';
const sum=(a,f)=>a.reduce((t,r)=>t+num(typeof f==='function'?f(r):r[f]),0);
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function fmtN(n){n=num(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(a>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e4)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return Math.round(n).toLocaleString('en-US')}
const fmtUSD=n=>'$'+fmtN(n);
const fmtPct=n=>(Math.round(num(n)*10)/10)+'%';
function fmtBy(f,v){if(!has(v))return'—';return f==='usd'?fmtUSD(v):f==='pct'?fmtPct(v):f==='h'?Math.round(num(v)*10)/10+'h':fmtN(v)}
const fmtDate=d=>{if(!d)return'—';const x=new Date(d+'T00:00:00');return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const monthLabel=id=>{const [y,m]=id.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'})};
const pct=(a,b)=>b>0?a/b*100:null;
let afterFns=[];const after=f=>afterFns.push(f);
let uid=0;const nid=p=>p+'-'+(++uid);
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- filtering ---------- */
function inPeriod(d){if(st.period==='all'||!d)return true;return daysBetween(d,today())<=+st.period}
function inCity(r){if(st.city==='All')return true;return !r.city||r.city===st.city||r.city==='Online / national'}
const ALL=c=>st.data[c]||[];

const M=()=>st.metrics; // sorted asc
const latest=()=>M().length?M()[M().length-1]:null;
const prev=()=>M().length>1?M()[M().length-2]:null;
const mv=k=>{const l=latest();return l&&has(l[k])?num(l[k]):null};
const mprev=k=>{const p=prev();return p&&has(p[k])?num(p[k]):null};
const series=k=>M().filter(m=>has(m[k])).map(m=>({x:m.id,y:num(m[k])}));

/* ---------- status from target ---------- */
function ratio(v,t,lower){if(v===null||v===undefined||!t)return null;if(lower)return v<=0?1:Math.min(t/v,1.5);return v/t}
function statusOf(r){if(r===null)return{c:'',t:'No target'};if(r>=1)return{c:'good',t:'On track'};if(r>=.7)return{c:'warn',t:'At risk'};return{c:'bad',t:'Off track'}}
const statusPill=r=>{const s=statusOf(r);return `<span class="status ${s.c}">${s.t}</span>`};

/* ---------- alerts, guardrails, calendar ---------- */
function alerts(){
  const out=[],T=set().targets,t=today();
  PILLARS.forEach(p=>p.kpis.forEach(k=>{const r=ratio(val(k),T[k],MDEF[k]?.lower);if(r!==null&&r<.7&&k!=='open_high_risks')out.push({sev:'serious',text:`${klabel(k)} is at ${Math.round(r*100)}% of target (${fmtBy(kfmt(k),val(k))} vs ${fmtBy(kfmt(k),T[k])})`,tab:p.tab})}));
  METRICS.forEach(m=>{const a=mv(m.k),b=mprev(m.k);if(a===null||b===null||b<=0)return;const ch=(a-b)/b;if(!m.lower&&ch<=-.15)out.push({sev:'warning',text:`${m.l} fell ${Math.round(-ch*100)}% month on month`,tab:'metrics'});if(m.k==='studio_signups'&&ch>=1.5)out.push({sev:'warning',text:`Studio sign-ups jumped ${Math.round(ch*100)}%: check for fake or farmed accounts`,tab:'builders'})});
  const l=latest();if(!l)out.push({sev:'warning',text:'No monthly numbers entered yet',tab:'metrics'});else{const cur=t.slice(0,7);if(l.id<addDays(t,-45).slice(0,7))out.push({sev:'warning',text:`Monthly numbers are stale (last: ${monthLabel(l.id)})`,tab:'metrics'});else if(l.id<cur&&+t.slice(8)>7)out.push({sev:'warning',text:`${monthLabel(cur)} numbers not entered yet`,tab:'metrics'})}
  ALL('deals').forEach(d=>{if(['Lost','Live','Expanding'].includes(d.stage))return;if(d.lastContact&&daysBetween(d.lastContact,t)>14)out.push({sev:'warning',text:`${d.org}: no contact in ${daysBetween(d.lastContact,t)} days`,tab:'bd'});if(d.nextDate&&d.nextDate<t)out.push({sev:'serious',text:`${d.org}: next step overdue (${d.nextStep||'follow up'})`,tab:'bd'})});
  ALL('tasks').forEach(x=>{if(x.status!=='Done'&&x.due&&x.due<t)out.push({sev:x.priority==='High'?'serious':'warning',text:`Overdue task: ${x.title}${x.owner?' ('+x.owner+')':''}`,tab:'tasks'});if(x.status==='Blocked')out.push({sev:'warning',text:`Blocked: ${x.title}`,tab:'tasks'})});
  ALL('risks').forEach(r=>{if(r.status==='Closed')return;if(r.kind==='Scam / impersonation')out.push({sev:'critical',text:`Open scam / impersonation report: ${r.title}`,tab:'policy'});else if(r.impact==='High'&&r.likelihood==='High')out.push({sev:'critical',text:`High-likelihood, high-impact risk: ${r.title}`,tab:'policy'});if(r.review&&r.review<t)out.push({sev:'warning',text:`Risk review overdue: ${r.title}`,tab:'policy'})});
  ALL('grants').forEach(g=>{if(['Approved','Milestones'].includes(g.status)&&g.nextMs&&g.nextMs<t)out.push({sev:'warning',text:`Grant milestone overdue: ${g.project}`,tab:'projects'})});
  ALL('ramps').forEach(r=>{if(r.status==='Live'&&r.updated&&daysBetween(r.updated,t)>30)out.push({sev:'warning',text:`${r.venue}: Arc support not re-checked in ${daysBetween(r.updated,t)} days`,tab:'users'})});
  ALL('mentions').filter(m=>m.sentiment==='Negative'&&inPeriod(m.date)&&daysBetween(m.date,t)<=7).forEach(m=>out.push({sev:'serious',text:`Negative mention this week: ${m.title}`,tab:'brand'}));
  ALL('budget').length&&(()=>{const p=sum(ALL('budget'),'planned'),a=sum(ALL('budget'),'actual');if(p&&a>p)out.push({sev:'serious',text:`Spend ${fmtUSD(a)} is over plan ${fmtUSD(p)}`,tab:'budget'})})();
  const rank={critical:0,serious:1,warning:2};return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}
function guardrails(){
  const g=[];const apps=ALL('projects').filter(p=>num(p.volume)>0);const tot=sum(apps,'volume');
  if(tot){const top=apps.reduce((a,b)=>num(b.volume)>num(a.volume)?b:a);const share=num(top.volume)/tot*100;g.push({ok:share<50,t:`Volume concentration: top app ${esc(top.name)} has ${fmtPct(share)} of Nigerian app volume`,hint:'Over 50% means one app or wallet cluster could be distorting the total.'})}
  const done=R('events').filter(e=>e.status==='Done');const zero=done.filter(e=>!num(e.signups)&&!num(e.shipped));
  if(done.length)g.push({ok:zero.length===0,t:`${zero.length} of ${done.length} events had no sign-ups or shipped work afterwards`,hint:'Attendance without follow-through does not count as growth.'});
  const a=mv('studio_signups'),b=mprev('studio_signups');if(a!==null&&b){const ch=(a-b)/b*100;g.push({ok:ch<150,t:`Studio sign-ups changed ${ch>=0?'+':''}${Math.round(ch)}% month on month`,hint:'Jumps over 150% get checked for farmed or fake accounts before they count.'})}
  const ms=R('mentions');if(ms.length){const neg=ms.filter(m=>m.sentiment==='Negative').length/ms.length*100;g.push({ok:neg<20,t:`${fmtPct(neg)} of logged mentions are negative`,hint:'Over 20% needs a response plan.'})}
  const scams=ALL('risks').filter(r=>r.kind==='Scam / impersonation'&&r.status!=='Closed').length;g.push({ok:scams===0,t:`${scams} open scam or impersonation report${scams===1?'':'s'}`,hint:'Fake Arc-branded tokens, sites and accounts are taken down and warned about.'});
  return g;
}
function calendarItems(){

    ['Events run',c=>ALL('events').filter(r=>r.city===c&&r.status==='Done'&&inPeriod(r.date)).length],

    ['Partners live',c=>ALL('deals').filter(r=>r.city===c&&['Live','Expanding'].includes(r.stage)).length],
    ['Learners',c=>sum(ALL('courses').filter(r=>r.city===c),'enrolled')],
  ];
  const rows=cities.map(c=>({c,v:dims.map(d=>d[1](c))}));

  rows.forEach(r=>{r.score=Math.round(r.v.reduce((a,v,i)=>a+v/max[i],0)/dims.length*100)});
  return {dims:dims.map(d=>d[0]),rows:rows.sort((a,b)=>b.score-a.score)};
}

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

  const move=ev=>{const r=s.getBoundingClientRect();const sx=(ev.clientX-r.left)*W/r.width;let i=0,b=1e9;xs.forEach((x,j)=>{const d=Math.abs(X(j)-sx);if(d<b){b=d;i=j}});

    tip.innerHTML=`<b>${monthLabel(xs[i])}</b>`+lines.map(l=>{const p=l.pts.find(q=>q.x===xs[i]);return `<div class="r"><span><span class="sw" style="background:var(${l.c})"></span>${esc(l.name)}</span><span class="mono">${p?f(p.y):'—'}</span></div>`}).join('');

function bars(rows,{fmt,color='--s1',max}={}){

function funnel(steps,{fmt}={}){
  if(!steps.length||steps.every(s=>!num(s.v)))return '<div class="empty">No funnel numbers yet for this filter.</div>';
  const top=Math.max(...steps.map(s=>num(s.v)),1);let worst=-1,wv=2;
  steps.forEach((s,i)=>{if(i&&num(steps[i-1].v)>0){const c=num(s.v)/num(steps[i-1].v);if(c<wv){wv=c;worst=i}}});

}
function spark(k){const s=series(k).slice(-8);if(s.length<2)return'';const W=160,H=28,mx=Math.max(...s.map(p=>p.y)),mn=Math.min(...s.map(p=>p.y));const r=mx-mn||1;

function renderTable(id,c,rows,cols){

function reportText(kind){
  const s=set(),T=s.targets,l=latest();const lines=[];const L=x=>lines.push(x);
  L(`# Arc Nigeria · ${kind==='week'?'Weekly growth review':'Monthly report'}`);L(`Generated ${fmtDate(today())}${l?` · monthly numbers for ${monthLabel(l.id)}`:''}${st.city!=='All'?` · ${st.city}`:''}`);L('');
  L('## Headline');[['maep'],['usdc_volume'],['live_apps'],['funded_projects']].forEach(([k])=>{const v=mv(k),p=mprev(k);L(`- ${klabel(k)}: ${fmtBy(kfmt(k),v)} (target ${fmtBy(kfmt(k),T[k])}${v!==null&&p?`, ${(v-p)/p>=0?'+':''}${Math.round((v-p)/p*100)}% MoM`:''})`)});
  const hi=healthIndex();L(`- Ecosystem Health Index: ${hi===null?'—':hi+'/100'}`);L('');
  L('## Pillars');PILLARS.forEach(p=>{const sc=pillarScore(p);L(`- ${p.name}: ${sc===null?'—':sc} · ${p.kpis.map(k=>`${klabel(k)} ${fmtBy(kfmt(k),val(k))}`).join(', ')}`)});L('');
  const a=alerts();L('## Needs attention');if(!a.length)L('- Nothing flagged');a.slice(0,10).forEach(x=>L(`- [${x.sev}] ${x.text}`));L('');
  const d=R('deals',{noPeriod:1});L('## BD pipeline');countBy(d,'stage',S.deals.fields[2].o).forEach(x=>L(`- ${x.l}: ${x.v}`));L('');
  const days=kind==='week'?7:31;const up=calendarItems().filter(x=>x.d>=today()&&x.d<=addDays(today(),days));L(`## Coming up (next ${days} days)`);if(!up.length)L('- Nothing scheduled');up.slice(0,15).forEach(x=>L(`- ${x.d} · ${x.kind}: ${x.title}`));L('');
  const ex=ALL('experiments').filter(e=>['Won','Lost','Inconclusive'].includes(e.status)&&inPeriod(e.end));L('## Experiments concluded');if(!ex.length)L('- None in this period');ex.forEach(e=>L(`- ${e.name}: ${e.status}${e.learning?' · '+e.learning:''}`));L('');
  const b=ALL('budget');L('## Budget');L(`- Planned ${fmtUSD(sum(b,'planned'))} · Actual ${fmtUSD(sum(b,'actual'))}`);
  return lines.join('\n');
}

/* ---------- forms ---------- */
function inputFor(f,v,id){
  const s=set();const val=v??'';
  if(f.t==='sel'||f.t==='city'||f.t==='campus'||f.t==='comp'||f.t==='metric'){
    const opts=f.t==='city'?['',...s.cities]:f.t==='campus'?['',...s.campuses]:f.t==='comp'?['',...s.competitors]:f.t==='metric'?['',...METRICS.map(m=>m.k)]:f.o;
    const list=opts.includes(val)||val===''?opts:[...opts,val];
    return `<select id="${id}">${list.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(f.t==='metric'&&o?MDEF[o].l:o||'—')}</option>`).join('')}</select>`}
  if(f.t==='area')return `<textarea id="${id}">${esc(val)}</textarea>`;
  if(f.t==='num'||f.t==='usd')return `<input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(val)}">`;
  if(f.t==='date')return `<input id="${id}" type="date" value="${esc(val)}">`;
  return `<input id="${id}" value="${esc(val)}"${f.req?' required':''}>`;
}

  const sc=S[c];const isNew=!rec;rec=rec||{};if(isNew&&sc.fields.some(f=>f.k==='city')&&st.city!=='All')rec={city:st.city};
  const ro=!st.canWrite;
  $('#modal-root').innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${isNew?'Add '+esc(sc.one):esc(rec[sc.title]||'Edit '+sc.one)}</h2>
   <p class="hint">${esc(sc.label)}${rec.example?' · Example record':''}${ro?' · read-only':''}</p>
   <form id="rec-form" class="form">${sc.fields.map(f=>`<label class="${f.t==='area'||f.wide?'wide':''}">${esc(f.l)}${f.req?' *':''}${inputFor(f,rec[f.k],'f-'+f.k)}</label>`).join('')}</form>
   <div class="actions">${!isNew&&!ro?`<span><button class="btn danger" id="m-del">Delete</button> <span id="m-delc"></span></span>`:'<span></span>'}${c==='contacts'&&!isNew?`<button class="btn" id="m-360">View 360</button>`:''}
   <span class="r"><button class="btn" id="m-cancel">${ro?'Close':'Cancel'}</button>${ro?'':`<button class="btn primary" id="m-save">${isNew?'Add':'Save'}</button>`}</span></div></div></div>`;
  if(ro)$('#rec-form').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);
  const first=$('#rec-form input,#rec-form select');first&&first.focus();
  $('#m-cancel').onclick=closeModal;
  $('#m-360')&&($('#m-360').onclick=()=>{st.openPerson=rec.id;closeModal();go('directory')});
  $('#rec-form').onsubmit=e=>{e.preventDefault();$('#m-save')?.click()};
  $('#m-save')&&($('#m-save').onclick=async()=>{
    const body={};for(const f of sc.fields){const el=$('#f-'+f.k);let v=el.value.trim();if(f.req&&!v){el.focus();toast(`${f.l} is required`);return}
      if(v==='')continue;if(f.t==='num'||f.t==='usd'){const n=Number(v);if(!Number.isFinite(n)){el.focus();toast(`${f.l} must be a number`);return}v=n}body[f.k]=v}
    body.updatedAt=new Date().toISOString();if(!isNew){body.createdAt=rec.createdAt||body.updatedAt;if(rec.createdBy)body.createdBy=rec.createdBy}else{body.createdAt=body.updatedAt;if(st.uid)body.createdBy=st.uid}
    const btn=$('#m-save');btn.disabled=true;
    try{const ref=isNew?st.db.collection(c).doc():st.db.collection(c).doc(rec.id);await ref.set(body);closeModal();toast(isNew?`Added ${sc.one}`:'Saved')}
    catch(err){btn.disabled=false;toast(writeError(err))}});
  $('#m-del')&&($('#m-del').onclick=()=>{$('#m-delc').innerHTML=`Delete for everyone? <button class="btn danger small" id="m-del2">Yes, delete</button>`;$('#m-del2').onclick=async()=>{try{await st.db.collection(c).doc(rec.id).delete();closeModal();toast('Deleted')}catch(err){toast(writeError(err))}}});
}
function writeError(e){const c=e&&e.code;if(c==='invalid_argument')return'You don’t have permission to change this data.';if(c==='quota_exceeded')return'The dashboard is full. Delete old records or examples first.';if(c==='resource_exhausted')return'Too many changes at once. Try again in a moment.';return'Couldn’t save. Check your connection and try again.'}
function openMonth(id){
  const isNew=id==='new';const rec=isNew?{}:M().find(m=>m.id===id)||{};const ro=!st.canWrite;const groups=[...new Set(METRICS.map(m=>m.g))];
  const def=isNew?today().slice(0,7):id;
  $('#modal-root').innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${isNew?'Add month':'Numbers for '+monthLabel(id)}</h2><p class="hint">National figures for the whole month. Leave blank what you don’t have yet.</p>
   <form id="rec-form" class="form"><label>Month<input type="month" id="mm-id" value="${esc(def)}" ${isNew?'':'disabled'}></label>
   ${groups.map(g=>`<fieldset><legend>${esc(g)}</legend>${METRICS.filter(m=>m.g===g).map(m=>`<label>${esc(m.l)}${m.f==='usd'?' (USD)':m.f==='pct'?' (%)':''}<input type="number" step="any" id="mm-${m.k}" value="${esc(rec[m.k]??'')}"></label>`).join('')}</fieldset>`).join('')}</form>
   <div class="actions">${!isNew&&!ro?`<span><button class="btn danger" id="m-del">Delete month</button> <span id="m-delc"></span></span>`:'<span></span>'}<span class="r"><button class="btn" id="m-cancel">${ro?'Close':'Cancel'}</button>${ro?'':`<button class="btn primary" id="m-save">Save</button>`}</span></div></div></div>`;
  if(ro)$('#rec-form').querySelectorAll('input').forEach(e=>e.disabled=true);
  $('#m-cancel').onclick=closeModal;$('#rec-form').onsubmit=e=>{e.preventDefault();$('#m-save')?.click()};
  $('#m-save')&&($('#m-save').onclick=async()=>{const mid=$('#mm-id').value;if(!/^\d{4}-\d{2}$/.test(mid)){toast('Pick a month');return}
    const body={};for(const m of METRICS){const v=$('#mm-'+m.k).value.trim();if(v==='')continue;const n=Number(v);if(!Number.isFinite(n)){toast(`${m.l} must be a number`);return}body[m.k]=n}
    body.updatedAt=new Date().toISOString();try{await st.db.collection('metrics').doc(mid).set(body);closeModal();toast('Saved '+monthLabel(mid))}catch(err){toast(writeError(err))}});
  $('#m-del')&&($('#m-del').onclick=()=>{$('#m-delc').innerHTML=`Delete this month? <button class="btn danger small" id="m-del2">Yes, delete</button>`;$('#m-del2').onclick=async()=>{try{await st.db.collection('metrics').doc(id).delete();closeModal();toast('Deleted')}catch(err){toast(writeError(err))}}});
}

/* ---------- CSV ---------- */
function csvEsc(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(keys,rows){return [keys.join(','),...rows.map(r=>keys.map(k=>csvEsc(r[k])).join(','))].join('\n')}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
async function saveFile(name,text){
  if(st.dl){try{await st.dl.save({filename:name,data:text});return}catch(e){if(e&&e.code==='declined')return}}
  const id=nid('raw');$('#modal-root').innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true"><h2>${esc(name)}</h2><p class="hint">Saving files isn’t available here. Copy the contents instead.</p><pre class="report" id="${id}">${esc(text)}</pre><div class="actions"><span></span><span class="r"><button class="btn" data-copy="${id}">Copy</button><button class="btn" id="m-cancel">Close</button></span></div></div></div>`;$('#m-cancel').onclick=closeModal}
function exportColl(c){if(c==='metrics'){saveFile('arc-ng-monthly-numbers.csv',toCSV(['month',...METRICS.map(m=>m.k)],M().map(m=>({...m,month:m.id}))));return}
  saveFile(`arc-ng-${c}.csv`,toCSV(['id',...S[c].fields.map(f=>f.k)],ALL(c)))}
function importColl(c){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';
  inp.onchange=async()=>{const file=inp.files[0];if(!file)return;const rows=parseCSV(await file.text());if(rows.length<2){toast('That file has no data rows');return}
    const hdr=rows[0].map(h=>h.trim().toLowerCase());
    if(c==='metrics'){const mi=hdr.indexOf('month');if(mi<0){toast('Add a “month” column (YYYY-MM)');return}let n=0;
      for(const r of rows.slice(1)){const id=(r[mi]||'').trim().slice(0,7);if(!/^\d{4}-\d{2}$/.test(id))continue;const body={updatedAt:new Date().toISOString()};
        METRICS.forEach(m=>{const i=hdr.indexOf(m.k)>=0?hdr.indexOf(m.k):hdr.indexOf(m.l.toLowerCase());if(i>=0&&r[i]!==undefined&&r[i].trim()!==''&&Number.isFinite(Number(r[i])))body[m.k]=Number(r[i])});
        try{await st.db.collection('metrics').doc(id).set(body);n++}catch(e){toast(writeError(e));return}}toast(`Imported ${n} months`);return}
    const map=S[c].fields.map(f=>{const i=hdr.indexOf(f.k.toLowerCase());return [f,i>=0?i:hdr.indexOf(f.l.toLowerCase())]}).filter(x=>x[1]>=0);
    const idi=hdr.indexOf('id');if(!map.length){toast('No columns matched. Download the template for the right headers.');return}
    let n=0;toast(`Importing ${rows.length-1} rows…`);
    for(const r of rows.slice(1)){const body={};map.forEach(([f,i])=>{let v=(r[i]??'').trim();if(v==='')return;if(f.t==='num'||f.t==='usd'){v=Number(v.replace(/[$,]/g,''));if(!Number.isFinite(v))return}body[f.k]=v});
      if(!Object.keys(body).length)continue;body.updatedAt=new Date().toISOString();body.createdAt=body.updatedAt;if(st.uid)body.createdBy=st.uid;
      const id=idi>=0&&/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test((r[idi]||'').trim())?r[idi].trim():null;
      try{await (id?st.db.collection(c).doc(id):st.db.collection(c).doc()).set(body);n++}catch(e){toast(writeError(e));return}}
    toast(`Imported ${n} ${S[c].label.toLowerCase()}`)};inp.click()}
function exampleCount(){return COLLS.reduce((a,c)=>a+ALL(c).filter(r=>r.example).length,0)+M().filter(m=>m.example).length}
async function clearExamples(){let n=0;try{for(const c of COLLS)for(const r of ALL(c).filter(r=>r.example)){await st.db.collection(c).doc(r.id).delete();n++}
  for(const m of M().filter(m=>m.example)){await st.db.collection('metrics').doc(m.id).delete();n++}toast(`Removed ${n} example records`)}catch(e){toast(writeError(e))}}

/* ---------- render ---------- */
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function render(){
  const ae=document.activeElement;const aid=ae&&ae.id&&$('#view').contains(ae)?ae.id:null;const sel=aid&&ae.selectionStart!==undefined?[ae.selectionStart,ae.selectionEnd]:null;
  afterFns=[];uid=0;
  const fn=V[st.tab]||V.overview;$('#view').innerHTML=fn();afterFns.forEach(f=>{try{f()}catch(e){console.error(e)}});
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{sel&&el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  document.querySelectorAll('.navbtn').forEach(b=>b.setAttribute('aria-current',b.dataset.go===st.tab?'page':'false'));$('#nav-select').value=st.tab;
  renderBanner();
  if(st.tab==='growth')bindUTM();
}
function renderBanner(){const n=exampleCount();let h='';
  if(st.mode==='offline')h=`<div class="banner info">The shared team data loads when this page is opened in claude.ai while signed in. Nothing here is saved.</div>`;
  else if(st.mode==='live'&&n)h=`<div class="banner"><span><b>Example data.</b> ${n} records and months marked “Example” show how the dashboard works. Replace them with real numbers.</span>${st.canWrite?'<button class="btn small" data-go="settings">Remove examples</button>':''}</div>`;
  else if(st.mode==='live'&&!st.canWrite)h=`<div class="banner info">You have view access. Ask the owner for Contributor access to add or edit records.</div>`;
  $('#banner').innerHTML=h}
function bindUTM(){const ids=['utm-url','utm-src','utm-med','utm-cmp'];const out=$('#utm-out');if(!out)return;
  const upd=()=>{const [u,s,m,c]=ids.map(i=>$('#'+i).value.trim());if(!u){out.textContent='Fill in the fields to build a link.';return}
    try{const x=new URL(u);if(s)x.searchParams.set('utm_source',s);if(m)x.searchParams.set('utm_medium',m);if(c)x.searchParams.set('utm_campaign',c);out.textContent=x.toString()}catch(e){out.textContent='Enter a full URL starting with https://'}};
  ids.forEach(i=>$('#'+i).addEventListener('input',upd));$('#utm-copy').onclick=()=>copyText(out.textContent,out)}
function copyText(t,el){navigator.clipboard?.writeText(t).then(()=>toast('Copied'),()=>{selectEl(el);toast('Press Ctrl+C / ⌘C to copy')})??(selectEl(el),toast('Press Ctrl+C / ⌘C to copy'))}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function go(tab){st.tab=tab;try{localStorage.setItem('arcng-tab',tab)}catch(e){}window.scrollTo(0,0);render()}

/* ---------- nav + events ---------- */
function buildNav(){
  $('#navlist').innerHTML=NAV.map(([g,items])=>`<div class="navgroup"><h4>${g}</h4>${items.map(([id,l])=>`<button class="navbtn" data-go="${id}">${esc(l)}</button>`).join('')}</div>`).join('');
  $('#nav-select').innerHTML=NAV.map(([g,items])=>`<optgroup label="${g}">${items.map(([id,l])=>`<option value="${id}">${esc(l)}</option>`).join('')}</optgroup>`).join('');
  $('#nav-select').onchange=e=>go(e.target.value);
}
function buildCity(){const c=$('#f-city');const cur=st.city;c.innerHTML=['All',...set().cities.filter(x=>x!=='Online / national')].map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-add],[data-open],[data-export],[data-import],[data-template],[data-month],[data-copy],[data-save],[data-backup],[data-clear-ex],[data-close360],[data-sort],[data-overlay]');if(!t)return;
  if(t.dataset.overlay!==undefined){if(e.target===t)closeModal();return}
  if(t.dataset.go){closeModal();go(t.dataset.go)}
  else if(t.dataset.add){if(st.db)openForm(t.dataset.add)}
  else if(t.dataset.open){const [c,id]=t.dataset.open.split(':');const r=ALL(c).find(x=>x.id===id);if(r)openForm(c,r)}
  else if(t.dataset.export)exportColl(t.dataset.export);
  else if(t.dataset.import){if(st.db)importColl(t.dataset.import)}
  else if(t.dataset.template){const c=t.dataset.template;saveFile(`arc-ng-${c}-template.csv`,S[c].fields.map(f=>f.k).join(',')+'\n')}
  else if(t.dataset.month)openMonth(t.dataset.month);
  else if(t.dataset.copy){const el=document.getElementById(t.dataset.copy);copyText(el.textContent,el)}
  else if(t.dataset.save){saveFile(`arc-ng-${st.reportKind||'week'}-report-${today()}.md`,document.getElementById(t.dataset.save).textContent)}
  else if(t.dataset.backup!==undefined){saveFile(`arc-ng-backup-${today()}.json`,JSON.stringify({exported:new Date().toISOString(),settings:st.settings,metrics:M(),records:st.data},null,1))}
  else if(t.dataset.clearEx!==undefined){$('#clear-confirm').innerHTML=` Remove ${exampleCount()} records for everyone? <button class="btn danger small" id="clear2">Yes, remove</button>`;$('#clear2').onclick=clearExamples}
  else if(t.dataset.close360!==undefined){st.openPerson=null;render()}
  else if(t.dataset.sort){const [c,k]=t.dataset.sort.split(':');const cur=st.sort[c];st.sort[c]={k,d:cur&&cur.k===k?-cur.d:-1};render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-open]'))e.target.click()});
document.addEventListener('change',e=>{if(e.target.id==='rep-kind'){st.reportKind=e.target.value;render()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='settings-form')return;e.preventDefault();
  const split=v=>v.split(',').map(x=>x.trim()).filter(Boolean);const body={startDate:$('#set-start').value||DEFAULTS.startDate,cities:split($('#set-cities').value),campuses:split($('#set-campuses').value),competitors:split($('#set-comp').value),weights:{},targets:{},updatedAt:new Date().toISOString()};
  PILLARS.forEach(p=>body.weights[p.id]=num($('#w-'+p.id).value));Object.keys(DEFAULTS.targets).forEach(k=>{const v=$('#t-'+k).value;if(v!=='')body.targets[k]=Number(v)});
  try{await st.db.collection('config').doc('settings').set(body);toast('Settings saved')}catch(err){toast(writeError(err))}});
$('#f-city').onchange=e=>{st.city=e.target.value;render()};
$('#f-period').onchange=e=>{st.period=e.target.value;render()};
let rw=0;window.addEventListener('resize',()=>{clearTimeout(rw);rw=setTimeout(render,150)});

/* ---------- boot ---------- */
buildNav();buildCity();
try{const h=(location.hash||'').slice(1);const saved=localStorage.getItem('arcng-tab');st.tab=V[h]?h:V[saved]?saved:'overview'}catch(e){}
render();
const conn=(mode,text)=>{st.mode=mode;$('#conn').className='chip'+(mode==='live'?' live':'');$('#conn-t').textContent=text;renderBanner()};
(async()=>{
  const c=window.claude;if(!c||!c.use){conn('offline','Not connected');render();return}
  const [db,user,dl]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')].map(p=>p.catch(()=>null)));
  st.dl=dl;st.user=user;
  if(!db){conn('offline','Not connected');render();return}
  st.db=db;
  if(user){try{st.uid=await user.id()}catch(e){}try{const w=await user.can('data.write');st.canWrite=w!==false}catch(e){st.canWrite=true}}else st.canWrite=true;
  conn('live','Live team data');
  const onErr=e=>{if(e&&e.code==='revoked'){st.canWrite=false;conn('offline','Access changed')}else console.warn(e)};
  COLLS.forEach(name=>db.collection(name).limit(1000).onSnapshot(s=>{st.data[name]=s.docs.map(d=>({id:d.id,...d.data()}));schedule()},onErr));
  db.collection('metrics').limit(240).onSnapshot(s=>{st.metrics=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>/^\d{4}-\d{2}$/.test(m.id)).sort((a,b)=>a.id.localeCompare(b.id));schedule()},onErr);
  db.doc('config/settings').onSnapshot(s=>{st.settings=s.exists?s.data():null;buildCity();schedule()},onErr);
  render();
})();
})();
</script>
